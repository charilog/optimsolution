# --- Example sensitivity config additions ---
[sensitivity]
enabled = 1
mode    = grid                  ; currently only "grid" is used
output  = sensitivity_results.csv

# choose which method parameters to sweep (must match keys read in method::configure)
params  = F, CR

# provide the candidate values per parameter
values.F  = 0.3, 0.5, 0.8
values.CR = 0.4, 0.7, 0.9
