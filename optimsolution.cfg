[interceptorguidance]
; ADIG v4 - Adaptive Divert-Budget Interceptor Guidance under Deceptive
; Threat Maneuvering (surrogate benchmark, src/problems/interceptorguidance.h/.cpp).
;
; v4 design: everything is built from the DEVIATION e_i = x_i - r(tau_i)
; from a known, fixed reference schedule r(tau). This guarantees the TRUE
; GLOBAL MINIMUM IS EXACTLY 0.0 for every dimension D and every M1/M2/M3
; combination (verified: D=1..512, all 8 mechanism combos, f=0.0 exactly
; at x_i=r(tau_i)) -- see the proof in interceptorguidance.cpp's top comment.
; Only the DIFFICULTY of finding that fixed minimum changes with D and with
; which mechanisms are enabled, via two tunable logistic "severity" gates:
;   baseline_severity(D):  pivot D0_base / width width_base (default 60/15)
;   mechanism_severity(D): pivot D0_mech / width width_mech (default 20/6)
; Empirically verified (DE, 2000-2500 evals/dim): baseline (all M-flags
; off) stays near-zero cost up to ~D=40-50 then grows steadily out past
; D=200; with all mechanisms on, the same growth starts around D=10-20.

; -- Mechanism flags --------------------------------------------------------
m1_enable = 1   ; extra sequential-coupling penalty (mechanism_severity)
m2_enable = 1   ; extra, denser multimodal ripple (mechanism_severity)
m3_enable = 1   ; divert-fuel budget + deceptive pacing corridor (mechanism_severity)

; -- Reference schedule r(tau) = clamp01(center + amp*sin(2*PI*freq*tau + phase)) --
ref_center = 0.50
ref_amp    = 0.30
ref_freq   = 1.00
ref_phase  = 0.40

; -- Always-on core: dominant, strictly-convex "pull to truth" -----------
; (never severity-gated; alone already guarantees e=0 is the unique optimum)
core_weight     = 6.0
terminal_weight = 4.0

; -- Always-on baseline coupling + ruggedness (onset ~ D0_base) ----------
base_couple_weight = 0.20
base_couple_rho    = 0.50
base_rugged_weight = 0.60
base_rugged_freq   = 6.0

; -- M1 extra coupling (onset ~ D0_mech, only when M1 on) ----------------
; v8: sin^2(freq*c) instead of plain c^2 -- genuine multimodality in the
; coupling relationship (like M2's ripple), not just a sharper single
; valley, which previously let SHADE/CMA-ES-family search exploit it as a
; shortcut instead of a real obstacle.
m1_extra_couple_weight   = 2.2
m1_extra_couple_rho      = 0.85
m1_extra_couple_freq     = 5.0
m1_extra_terminal_weight = 3.0

; -- M2 extra, denser ripple (onset ~ D0_mech, only when M2 on) ----------
m2_extra_rugged_weight = 1.20
m2_extra_rugged_freq   = 20.0

; -- Always-on effort/control cost (purely deviation-driven, zero at optimum) --
base_fuel_weight = 0.5
fuel_burn_gain   = 1.2
fuel_burn_quad   = 0.7
; v9: ripple component on the burn rate itself (same fix as M1 above) --
; lmcmaes was found exploiting the purely-smooth burn/corridor signal as a
; shortcut, worsening systematically with D.
fuel_burn_ripple_weight = 0.8
fuel_burn_ripple_freq   = 8.0

; -- M3 divert-fuel budget + corridor (onset ~ D0_mech, only when M3 on) --
fuel_init       = 0.85
overrun_weight  = 9.0
corridor_weight = 2.0
corridor_slack  = 0.06                ; v5: tightened from 0.50 so M3 also bites near-optimal candidates, not just badly-exploring ones (checked every stage now, not just 3 checkpoints)

; -- Difficulty-onset pivots (dimension), fully tunable without code changes --
d0_base    = 60.0
width_base = 15.0
d0_mech    = 20.0
width_mech = 6.0

