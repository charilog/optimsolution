[global]
population = 100                     ; Default population size (agents/individuals)
max_iters = 5000000                  ; Maximum iterations per run (upper bound, may stop earlier)
max_evals = 150000 					 ; Maximum objective-function evaluations per run (main budget)
seed_base = 4242                     ; Base seed used to generate per-run random seeds
runs = 30 							 ; Number of independent runs (different seeds) in the experiment
success_tol = 1e-8                   ; Success tolerance (distance to target/best-of-runs threshold)
local_rate = 0.00 					 ; Probability/frequency of invoking in-run local search (0 = disabled)
local_method = lbfgs                 ; Default local search method identifier (used if local search is enabled)
end_local_refine = 0 				 ; Whether to run local search refinement at the end of each run (0 = no)
end_local_method = lbfgs             ; End-of-run local search method (if enabled) ; or bfgs / nm / gd
csv_enable = 1 						 ; Master switch for CSV output files (0 = disabled)
csv_convergence = 1                  ; Export convergence trace to CSV (0 = no)
csv_summary = 1                      ; Export run summary statistics to CSV (0 = no)
summary_enable = 1 					 ; Enable printing the run summary to console (1 = enabled)
summary_show_general = 1       	     ; Show GENERAL section in summary
summary_show_problem = 1             ; Show PROBLEM INFO section in summary
summary_show_config = 1              ; Show EXPERIMENT CONFIG section in summary
summary_show_performance = 1         ; Show PERFORMANCE section in summary
summary_show_calls = 1               ; Show CALLS & SUCCESS section in summary
summary_show_timing = 1              ; Show TIMING & MEMORY section in summary
summary_show_local = 1               ; Show LOCAL SEARCH section in summary
summary_show_highlights = 1          ; Show SUMMARY HIGHLIGHTS section in summary

[stop]
rule = maxevals ; Stop rule: bss|wss|tss|boss|srs|irs|doublebox|maxevals|all|none
eps = 1e-10                      ; Numerical tolerance parameter for relevant stop rules (problem-dependent use)
sim = 50 ; Similarity/plateau window parameter used by some stop rules (if applicable)
sumRate = 0.1                        ; Summation/trigger rate used by some stop rules (if applicable)

[init]
type = uniform                       ; Distribution type ; uniform | normal | cauchy | laplace | lognormal | exponential | beta | levy | lhs | halton | oppositional
mu = 0.0                             ; Mean parameter (used by normal/laplace/lognormal)
sigma = 1.0                          ; Std-dev parameter (used by normal/lognormal)
gamma = 1.0                          ; Scale parameter (used by cauchy)
b = 1.0                              ; Scale parameter (used by laplace)
lambda = 1.0                         ; Rate parameter (used by exponential)
alpha = 2.0                          ; Alpha parameter (used by beta)
beta = 5.0                           ; Beta parameter (used by beta)
c = 1.0                              ; Scale/shape parameter (used by levy)

[sensitivity]
mode = grid                          ; Sweep mode (e.g., grid search over listed values)
output = sensitivity_results.csv     ; Output CSV file for sensitivity results
enable = 0
params = 
enabled = 0

