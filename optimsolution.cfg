[global]
population = 200
max_iters  = 500000
max_evals  = 150000
seed_base  = 4242
runs       = 30
success_tol = 1e-8
local_rate   = 0.00
local_method = lbfgs
end_local_refine = 0
end_local_method = lbfgs   ; or bfgs / nm / gd
csv_enable = 0
csv_convergence = 0
csv_summary = 0
summary_enable           = 1   
summary_show_general     = 1   ; GENERAL
summary_show_problem     = 1   ; PROBLEM INFO
summary_show_config      = 1   ; EXPERIMENT CONFIG
summary_show_performance = 1   ; PERFORMANCE
summary_show_calls       = 1   ; CALLS & SUCCESS
summary_show_timing      = 1   ; TIMING & MEMORY
summary_show_local       = 1   ; LOCAL SEARCH
summary_show_highlights  = 1   ; SUMMARY HIGHLIGHTS

[stop ]
rule    = maxevals         ; bss|wss|tss|boss|srs|irs|doublebox|maxevals|all|none
eps     = 1e-10
sim     = 12
sumRate = 0.1

[init]
type = uniform             ; uniform | normal | cauchy | laplace | lognormal | exponential | beta | levy | lhs | halton | oppositional
mu = 0.0                   ; for normal/laplace/lognormal
sigma = 1.0                ; for normal/lognormal
gamma = 1.0                ; for cauchy
b = 1.0                    ; for laplace
lambda = 1.0               ; for exponential
alpha = 2.0                ; for beta
beta = 5.0                 ; for beta
c = 1.0                    ; for levy

[sensitivity]
enabled = 0
mode    = grid
output  = sensitivity_results.csv
params  = F, CR
values.F  = 0.3, 0.5, 0.8
values.CR = 0.4, 0.7, 0.9

# ---------------- LOCAL METHODS ----------------
[gd]
; Gradient Descent
alpha0     = 1.0
c1         = 1e-4
backtracks = 20
tol        = 1e-8         ; ||grad|| threshold
max_iters  = 500

[lbfgs]
; Limited-memory BFGS
m_history  = 10
alpha0     = 1.0
c1         = 1e-4
backtracks = 20
tol        = 1e-8
max_iters  = 500

[bfgs]
; BFGS
alpha0     = 1.0
c1         = 1e-4
backtracks = 20
tol        = 1e-8
max_iters  = 500

[nm]
