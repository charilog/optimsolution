[lsrtde]
; L-SRTDE: Success Rate-based adaptive DE with linear population size reduction
; (Stanovov & Semenkin, IEEE CEC 2024 winner). Defaults = official CEC 2024 code.
population = 0                ; default: np_init_multiplier*D (= 20*D, Stanovov & Semenkin 2024); >0 overrides
np_init_multiplier = 20       ; initial population N_init = multiplier * D (used when population = 0)
np_min = 4                    ; final population size of the linear reduction N_init -> np_min (>= 4)
memory_size = 5               ; size H of the CR success memory
mcr_init = 1.0                ; initial value of every CR memory cell
memory_c = 0.5                ; M_CR <- memory_c*M_CR + (1-memory_c)*meanWL(actual CR)  (0.5 = reference)
sigma_cr = 0.05               ; std of CR ~ N(M_CR[k], sigma_cr), clamped to [0,1]
f_base = 0.4                  ; mean F = f_base + f_amp*tanh(f_sr_coef*SR), SR = last success rate
f_amp = 0.25                  ; amplitude of the success-rate term of mean F
f_sr_coef = 5.0               ; slope of tanh() in the mean-F formula
sigma_f = 0.02                ; std of F ~ N(meanF, sigma_f), resampled until F in [0,1]
pbest_rate = 0.7              ; p-best size = max(pbest_min, int(pbest_rate*N*exp(-pbest_sr_coef*SR)))
pbest_sr_coef = 7.0           ; success-rate decay coefficient of the p-best size
pbest_min = 2                 ; lower bound of the p-best size (>= 2)
rank_pressure = 3.0           ; rank-based choice of r1 from the front: weight = exp(-rank_pressure*rank/N)
sr_init = 0.5                 ; success rate assumed before the first generation
bound_handling = random       ; out-of-bounds components: random (reference) | midpoint | clip
delta_from_parent = 0         ; 0 = CR weights |delta f| exactly as official code, 1 = |f(parent)-f(trial)| (paper formula)
end_local_refine = 0          ; end-of-run local search (overrides [global] if present)
end_local_method = lbfgs      ; lbfgs | bfgs | nm | gd
debug_lsrtde = 0              ; 0 = off, 1 = init info, 2 = per-generation info

[ide]
; iDE: improved DE = L-SRTDE core + the mechanisms of SPARQ that improved the final
; solutions in measurements (CEC 2017 D=10/30): adaptive eigen crossover + archive,
; plus funnel scouting & adoption (iDE-FS) for multi-funnel landscapes. With eig_enable =
; archive_enable = polish_enable = rejuv_enable = scout_enable = 0 it reproduces L-SRTDE exactly.
; ---- L-SRTDE core (same meaning and defaults as [lsrtde]) ----
population = 0                ; 0 = np_init_multiplier*D
np_init_multiplier = 20       ; initial population N_init = multiplier * D
np_min = 4                    ; final population size of the linear reduction (>= 4)
memory_size = 5               ; size H of the CR success memory
mcr_init = 1.0                ; initial value of every CR memory cell
memory_c = 0.5                ; M_CR <- memory_c*M_CR + (1-memory_c)*meanWL(actual CR)
sigma_cr = 0.05               ; std of CR ~ N(M_CR[k], sigma_cr)
f_base = 0.4                  ; mean F = f_base + f_amp*tanh(f_sr_coef*SR)
f_amp = 0.25
f_sr_coef = 5.0
sigma_f = 0.02                ; std of F ~ N(meanF, sigma_f), resampled into [0,1]
pbest_rate = 0.7              ; p-best size = max(pbest_min, int(pbest_rate*N*exp(-pbest_sr_coef*SR)))
pbest_sr_coef = 7.0
pbest_min = 2
rank_pressure = 3.0           ; rank-based choice of r1: weight = exp(-rank_pressure*rank/N)
sr_init = 0.5
bound_handling = random       ; random (reference) | midpoint | clip
delta_from_parent = 0
; ---- (1) eigen-coordinate crossover (from SPARQ) ----
eig_enable = 1                ; 1 = on
eig_prob = 0.4                ; probability of the eigen-basis crossover (start value when eig_adapt = 1)
eig_adapt = 1                 ; 1 = share adapted from the success rates of eigen vs coordinate crossover
eig_pmin = 0.1                ; bounds of the adapted share
eig_pmax = 0.9
eig_frac = 0.5                ; covariance from the best eig_frac part of the main population (>= D+2 members)
eig_period = 5                ; refresh of the basis every eig_period generations
eig_max_dim = 100             ; above this dimension the eigen crossover is not used (O(D^3) cost)
; ---- (2) external archive (from SPARQ / JADE) ----
archive_enable = 1            ; overwritten front members enter the archive; r2 from main + archive
archive_rate = 1.0            ; archive size = archive_rate * N (2.0 was measured worse)
; ---- (3) end-phase elite polish: (1+1)-CMA-ES (from SPARQ "elite polish") -- no measurable gain, off ----
polish_enable = 0
polish_start = 0.85           ; starts after this fraction of the evaluation budget
polish_budget = 0.05          ; at most this fraction of the budget is used by the polish
polish_patience = 3           ; switched off after this many bursts less efficient (gain/evaluation) than the DE
; ---- (5) funnel scouting & adoption (iDE-FS) ----
; When the DE has stagnated in one funnel, a CLPSO swarm and an IPOP-CMA-ES scout
; other regions (fresh random starts, never fed by the DE); a scout point better
; than the DE is adopted and the DE continues in that funnel.
scout_enable = 1              ; 1 = on
scout_after = 0.15            ; earliest start of a scouting phase (fraction of the budget)
scout_window = 0.10           ; stagnation window (fraction of the budget)
scout_tol = 1e-4              ; stagnation: relative gain of the DE best over the window below this ...
scout_gain_frac = 0.1         ; ... and below this fraction of the front's (median - best) fitness spread ...
scout_fspread = 2e-3          ; ... the front's (median - best) is below this fraction of |best| ...
scout_spread = 0.03           ; ... and front diversity below this fraction of the box diagonal
scout_max = 0.35              ; budget of a scouting phase (fraction of max_evals) ...
scout_max_remain = 0.60       ; ... but at most this fraction of the remaining budget
scout_ratio = 1.0             ; scout evaluations per DE evaluation during a phase
scout_max_phases = 1          ; scouting phases per run
scout_clpso_share = 0.7       ; share of a phase for CLPSO (rest: CMA-ES)
scout_adopt_frac = 0.20       ; fraction of the populations replaced when another funnel is adopted
scout_min_dist = 0.05         ; "another funnel" = farther than this fraction of the box diagonal
scout_cma_max_dim = 100       ; no CMA-ES scout above this dimension (O(D^3) eigendecomposition)
; ---- (4) stagnation rejuvenation (from SPARQ) -- measured HARMFUL on CEC 2017, off ----
rejuv_enable = 0
rejuv_gens = 0                ; generations without improvement (0 = max(50, 3*D))
rejuv_keep = 0.25             ; fraction of the front that is kept
rejuv_cutoff = 0.7            ; no rejuvenation after this fraction of the budget
end_local_refine = 0          ; end-of-run local search (overrides [global] if present)
end_local_method = lbfgs
debug_ide = 0                 ; 0 = off, 1 = init info, 2 = per-generation info

[imspsodni]
; IMSPSO-DNI (Yao & Tian, Algorithms 2026): multiple subgroups PSO with Q-learning
; control of the number of subgroups, hierarchical elite cooperative updating
; (HECUM) and gbest perturbation based on dynamic neighborhood information (gPS-DNI).
; Defaults = Sec. 4.2 / Table 2 of the paper.
population = 30               ; swarm size N (paper: 30)
subgroups = 2,4,6,8,10        ; candidate numbers of subgroups S (states = actions of the Q-learning)
alpha = 0.1                   ; Q-learning rate (Eq. 6)
gamma = 0.9                   ; Q-learning discount factor (Eq. 6)
epsilon = 0.8                 ; probability of the greedy action (Eq. 7: rand < epsilon -> argmax Q)
w_max = 0.9                   ; inertia weight, linear 0.9 -> 0.4 (Eq. 5)
w_min = 0.4
c1_start = 2.5                ; cognitive coefficient, linear 2.5 -> 0.5
c1_end = 0.5
c2_start = 0.5                ; social coefficient, linear 0.5 -> 2.5
c2_end = 2.5
phi = 0.4                     ; weight of the second exemplar in Eq. 10
gl = 5                        ; gbest stagnation limit g_l (Alg. 3)
T = 0.5                       ; diversity threshold: D > T -> Eq. 12, else Eq. 13
R = 0.4                       ; radius factor of Eq. 13 (gbest_new = gbest + R*D*U(-1,1))
vmax_frac = 0.5               ; |V_j| <= vmax_frac*(ub_j - lb_j) (paper: velocity within [-100,100] for the [-100,100] box)
v_init = random               ; initial velocities: random U(-vmax,vmax) | zero
gc_reset_on_improve = 0       ; 0 = Alg. 3 (g_c unchanged on an improving iteration), 1 = reset to 0
accept_equal = 1              ; 1 = perturbed gbest adopted if not worse (text), 0 = only if strictly better (Alg. 3)
end_local_refine = 0          ; end-of-run local search (overrides [global] if present)
end_local_method = lbfgs
debug_imspsodni = 0           ; 0 = off, 1 = init info, 2 = per-iteration info

; ---------------------------------------------------------------------------
; PSO family -- phase 1 (spso2011, hclpso, olpso, glpso, apso, dmspso).
; Defaults = the settings of each method's reference paper (see the header of
; src/methods/<name>.h). Each section also accepts local_rate / local_method
; (in-run local search after a pbest improvement; default from [global]) and
; end_local_refine / end_local_method (override [global] if present).
; ---------------------------------------------------------------------------

[spso2011]
; Standard PSO 2011 (Clerc 2012; Zambrano-Bigiarini, Clerc & Rojas, CEC 2013)
population = 0                ; default: 40 (SPSO-2011 suggested swarm size)
K = 3                         ; adaptive random topology: each particle informs itself + K random particles
w = 0                         ; inertia, 0 = 1/(2 ln 2) ~ 0.7213
c = 0                         ; acceleration, 0 = 0.5 + ln 2 ~ 1.1931
rand_order = 1                ; 1 = particles moved in a random order each iteration (reference C code)
sphere_volume_uniform = 0     ; 0 = Clerc default (uniform radius r = U(0,R)), 1 = point uniform in the ball volume
bound_mode = reflect          ; skip | clamp | reflect (reflect = SPSO-2011 confinement: clip, v = -0.5 v)

[hclpso]
; Heterogeneous Comprehensive Learning PSO (Lynn & Suganthan, SWEVO 24, 2015)
population = 0                ; default: 40 (g1 = 15 exploration + g2 = 25 exploitation)
g1 = 0                        ; size of the exploration group, 0 = round(expl_ratio * population)
expl_ratio = 0.375            ; 15/40
w_start = 0.99                ; inertia, linear 0.99 -> 0.2
w_end = 0.2
k_start = 3.0                 ; exploration-group acceleration K, linear 3.0 -> 1.5
k_end = 1.5
c1_start = 2.5                ; exploitation group c1, linear 2.5 -> 0.5
c1_end = 0.5
c2_start = 0.5                ; exploitation group c2 (gbest term), linear 0.5 -> 2.5
c2_end = 2.5
pc_min = 0.0                  ; learning probability Pc_i = pc_min + (pc_max-pc_min)*(e^(pc_exp*t)-1)/(e^pc_exp-1)
pc_max = 0.25                 ; (authors' released code; CLPSO paper range would be 0.05 / 0.5)
pc_exp = 10.0
refresh_gap = 5               ; exemplar rebuilt when pbest has not improved for MORE than this many generations
vmax_frac = 0.2               ; Vmax = vmax_frac * (ub - lb)
bound_mode = skip             ; skip = authors' code (out-of-range particles not evaluated) | clamp | reflect

[olpso]
; Orthogonal Learning PSO (Zhan, Zhang, Li & Shi, IEEE TEVC 15(6), 2011)
population = 0                ; default: 40
topology = local              ; local = OLPSO-L (ring {i-1,i,i+1}), global = OLPSO-G
w_start = 0.9                 ; inertia, linear 0.9 -> 0.4
w_end = 0.4
c = 2.0                       ; acceleration towards the guidance vector Po
G = 5                         ; Po rebuilt after G generations without pbest improvement
vmax_frac = 0.2
bound_mode = skip             ; skip = paper (out-of-range particles not evaluated) | clamp | reflect
partner_mode = fixed          ; fixed = partner of Po fixed when Po is built, dynamic = Pn re-resolved each generation

[glpso]
; Genetic Learning PSO (Gong et al., IEEE TCYB 46(10), 2016)
population = 0                ; default: 50
w = 0.7298
c = 1.49618
pm = 0.01                     ; mutation probability per dimension (paper range 0.005-0.05)
sg = 7                        ; exemplar stagnation gap before the tournament
tour_frac = 0.2               ; tournament size as a fraction of the population (20%)
vmax_frac = 0.2               ; not in the paper; value of the reference (MetaBox) implementation
bound_mode = reflect          ; reference implementation: clip, v = -0.5 v | skip | clamp
init_exemplar_offspring = 1   ; 1 = initial exemplars are bred offspring (reference), 0 = initial pbests

[apso]
; Adaptive PSO with evolutionary state estimation (Zhan, Zhang, Li & Chung, IEEE TSMC-B 39(6), 2009)
population = 0                ; default: 20
c_init = 2.0                  ; initial c1 = c2
c_min = 1.5                   ; c1, c2 bounded to [c_min, c_max]
c_max = 2.5
c_sum_max = 4.0               ; if c1 + c2 > c_sum_max both are rescaled
delta_min = 0.05              ; per-generation change of c1/c2, delta ~ U(delta_min, delta_max)
delta_max = 0.1
els = 1                       ; elitist learning strategy in the convergence state (1 = on)
sigma_max = 1.0               ; ELS Gaussian std, linear sigma_max -> sigma_min
sigma_min = 0.1
vmax_frac = 0.2
bound_mode = skip             ; skip (default) | clamp | reflect -- not fixed by the paper

[dmspso]
; Dynamic Multi-Swarm PSO (Liang & Suganthan, SIS 2005 / CEC 2005; Zhao et al., CEC 2008)
population = 0                ; 0 = sub_size * n_swarms; a value > 3 is rounded up to a multiple of sub_size
sub_size = 3                  ; particles per sub-swarm
n_swarms = 0                  ; 0 = max(10, round(0.3*D)) (CEC 2008: 30/150/300 sub-swarms for D = 100/500/1000)
R = 10                        ; regrouping period (generations)
w = 0.729
w_end = -1                    ; < 0 = constant w (CEC 2008); e.g. w = 0.9, w_end = 0.2 for a linear schedule
c1 = 1.49445
c2 = 1.49445
vmax_frac = 0.2
bound_mode = skip             ; pbest only updated in range (CEC 2008) | clamp | reflect
global_phase = 0.9            ; fraction of the budget after which all particles form one gbest swarm
ls_period = 0                 ; DMS-L-PSO local search every ls_period generations (0 = off; paper: 100)
ls_count = 5                  ; pbests of this many random particles refined per local-search phase

