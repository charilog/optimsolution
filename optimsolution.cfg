; ------------------------------------------------------------------
; Ablation-study switches: every SPARQ mechanism can be individually
; enabled (1, default) or disabled (0). With all flags at 1 the
; behaviour is identical to the original (un-flagged) implementation.
;   enable_ide     : Thompson-bandit strategy selection + IDE step
;                    (0 = every iteration runs the ARQ step)
;   enable_levy    : quarantineLevy outlier re-seeding
;   enable_polish  : elitePolish stagnation-gated refinement
;   enable_obl     : OBL basin escape
;   enable_rejuv   : rejuvenate partial-restart machinery
;   enable_eigen   : eigen-space crossover (0 = classical binomial
;                    always; periodic eigen-basis recompute also skipped)
;   enable_rtr     : Restricted Tournament Replacement fallback
;                    (0 = plain greedy parent replacement only)
;   enable_archive : external archive (0 = r2 always from population)
;   enable_nlpsr   : NLPSR population shrink (0 = constant pop size)
;   enable_echo    : Trajectory-Echo recording + polish echo probes
;   enable_shade   : SHADE F/CR success-history adaptation
;                    (0 = F,CR sampled around fixed means 0.5/0.5)
; ------------------------------------------------------------------
enable_ide = 1
enable_levy = 1
enable_polish = 1
enable_obl = 1
enable_rejuv = 1
enable_eigen = 1
enable_rtr = 1
enable_archive = 1
enable_nlpsr = 1
enable_echo = 1
enable_shade = 1

[mscso]
population = 30            ; paper: 30 sand cats
SM = 2.0                   ; auditory feature
warning_frac = 0.30        ; paper: 30% of the population treated as "warning" sand cats
eps = 1e-10                ; Eq.(15) denominator guard
local_rate = 0.00
local_method = lbfgs

[emscso]
population = 30            ; Ninit (initial swarm size); set popscale>0 below to use D-scaled Ninit instead
SM = 2.0                   ; auditory feature (as in MSCSO)
warning_frac = 0.30        ; paper: 30% of the population treated as "warning" sand cats
eps = 1e-10                ; Eq.(15) denominator guard
; -- NLPSR: non-linear population size reduction (ported from SPARQ) --
enable_nlpsr = 1           ; 1=on, 0=off -> swarm size stays fixed at "population" for the whole run
popscale = 0               ; if > 0, Ninit = popscale * D (overrides "population" above)
Nmin = 10                  ; floor the swarm may shrink to
nlpsralpha = 0.5           ; 1.0 = linear shrink; <1 = slower early / faster late (NL-SHADE-RSP-like)
; -- Quarantine (ported from ARQ; the RTR selection half has been REMOVED) --
enable_quarantine = 1      ; 1=on, 0=off -> disables IQR reseed + stagnation micro-restart entirely
alpha = 1.0                ; quarantine: IQR multiplier for the outlier threshold (theta = Q3 + alpha*IQR)
rho = 0.08                 ; quarantine: fraction of detected outliers re-seeded per iteration
qsigma = 0.10              ; quarantine: re-seed Gaussian scale (fraction of box range)
w = 0.08                   ; micro-restart: fraction of worst individuals restarted on hard stagnation
rsigma = 0.18              ; micro-restart: Gaussian scale around best_x_ (fraction of box range)
stagnationtrigger = 24     ; no_improve iterations (no ANY Fbest improvement) before a micro-restart fires
; -- Elite Polish (NEW, replaces RTR): local intensification of best_x_ only,
;    strictly elitist (accept-only-if-better) and self-throttling -- improves
;    the best without risking the mean/rate of a typical run --
enable_polish = 1          ; 1=on, 0=off
polish_trigger = 10        ; no_improve iterations before a polish burst fires
polish_frac = 0.10         ; burst size = polish_frac * current population
ps_sigma = 0.02            ; adaptive full-D isotropic step (fraction of box range)
ps_sigma_c = 0.10          ; adaptive single-coordinate step (fraction of box range)
ps_sigma_min = 1e-9
ps_sigma_max = 0.25
polish_budget = 0.12       ; hard cap: fraction of evals-so-far polish may EVER consume, whole run
polish_min_relgain = 1e-3  ; below this relative gain, back off (exponential cooldown)
; -- Best-Anchored Levy Jump (NEW, replaces RTR): one heavy-tailed probe from
;    best_x_ per iteration, ramped in with stagnation, accept-only-if-better
;    -- a miss costs exactly one evaluation and touches nothing else --
enable_levy_jump = 1       ; 1=on, 0=off
levy_beta = 1.5            ; Mantegna stability index (1.5 = standard Cuckoo Search value)
levy_prob = 0.30           ; FULL fire probability once fully ramped
levy_scale = 0.05          ; jump scale, fraction of box range
levy_ramp = 8              ; no_improve iterations to reach full levy_prob (0 = always full)
local_rate = 0.00
local_method = lbfgs

