[adam]
; Adam (Kingma & Ba 2015) -- gradient-based local method (no line search).
; Usable as local_method / end_local_method = adam, or as the stand-alone method "adam"
; (one local search from a random [init] start, capped by max_evals).
; Evaluates f once per iteration and returns the BEST point it visited.
population = 0     ; default: N/A - gradient-based, no population
lr = 0.001         ; step size (Kingma & Ba default); used when lr_rel = 0
lr_rel = 0         ; >0: per-coordinate step = lr_rel * (ub - lb), scale-independent
beta1 = 0.9        ; 1st-moment decay
beta2 = 0.999      ; 2nd-moment decay
eps = 1e-8
amsgrad = 0        ; 1 = AMSGrad variant (Reddi et al. 2018)
lr_decay = none    ; none | invsqrt | cosine
patience = 0       ; >0: stop after this many iterations without improving the best f
tol = 1e-8         ; ||projected grad|| threshold
max_iters = 500

