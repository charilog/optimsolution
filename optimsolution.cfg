[global]
population = 100                     ; Default population size (agents/individuals)
max_iters = 5000000                  ; Maximum iterations per run (upper bound, may stop earlier)
max_evals = 10000xD 				 ; Maximum objective-function evaluations per run (main budget)
seed_base = 4242                     ; Base seed used to generate per-run random seeds
runs = 30 							 ; Number of independent runs (different seeds) in the experiment
parallel_runs = 1                    ; Run independent runs in parallel with OpenMP (0 = serial, 1 = parallel; results identical, output/CSV replayed in run order; GKLS problems always run serially)
omp_threads = 0                      ; OpenMP thread count for parallel_runs (0 = auto/all cores)
success_tol = 1e-8                   ; Success tolerance (distance to target/best-of-runs threshold)
local_rate = 0.00 					 ; Probability/frequency of invoking in-run local search (0 = disabled)
local_method = lbfgs                 ; Default local search method identifier (used if local search is enabled)
end_local_refine = 0 				 ; Whether to run local search refinement at the end of each run (0 = no)
end_local_method = lbfgs             ; End-of-run local search method (if enabled) ; or bfgs / nm / gd / cg / ncg / adam
csv_enable = 1 						 ; Master switch for CSV output files (0 = disabled)
csv_convergence = 1                  ; Export convergence trace to CSV (0 = no)
csv_summary = 1                      ; Export run summary statistics to CSV (0 = no)
summary_enable = 1 					 ; Enable printing the run summary to console (1 = enabled)
summary_show_general = 1       	     ; Show GENERAL section in summary
summary_show_problem = 1             ; Show PROBLEM INFO section in summary
summary_show_config = 1              ; Show EXPERIMENT CONFIG section in summary
summary_show_performance = 1         ; Show PERFORMANCE section in summary
summary_show_calls = 1               ; Show CALLS & SUCCESS section in summary
summary_show_timing = 1              ; Show TIMING & MEMORY section in summary
summary_show_local = 1               ; Show LOCAL SEARCH section in summary
summary_show_highlights = 1          ; Show SUMMARY HIGHLIGHTS section in summary
uscore_report = 1                    ; Export uscore_report_<timestamp>.xlsx after a batch run (1 = enabled, 0 = disabled)

[stop]
rule = maxevals ; Stop rule: bss|wss|tss|boss|srs|irs|doublebox|maxevals|all|none
eps = 1e-10                      ; Numerical tolerance parameter for relevant stop rules (problem-dependent use)
sim = 50 ; Similarity/plateau window parameter used by some stop rules (if applicable)
sumRate = 0.1                        ; Summation/trigger rate used by some stop rules (if applicable)

[init]
type = uniform                       ; Distribution type ; uniform | normal | cauchy | laplace | lognormal | exponential | beta | levy | lhs | halton | oppositional
mu = 0.0                             ; Mean parameter (used by normal/laplace/lognormal)
sigma = 1.0                          ; Std-dev parameter (used by normal/lognormal)
gamma = 1.0                          ; Scale parameter (used by cauchy)
b = 1.0                              ; Scale parameter (used by laplace)
lambda = 1.0                         ; Rate parameter (used by exponential)
alpha = 2.0                          ; Alpha parameter (used by beta)
beta = 5.0                           ; Beta parameter (used by beta)
c = 1.0                              ; Scale/shape parameter (used by levy)

[sensitivity]
mode = grid                          ; Sweep mode (e.g., grid search over listed values)
output = sensitivity_results.csv     ; Output CSV file for sensitivity results
enable = 0
params = 
enabled = 0

[nnlandscape]
; GUI run mode 7 ("Neural-network landscape / generalization gap"), stage 1
; (Train + sample landscape) only. Default (1, or this key/section absent)
; is fully serial: one --nnlandscape combination (dataset x architecture x
; optimizer x seed) trained at a time, exactly as before this option
; existed. Set to an integer > 1 to train that many combinations
; concurrently as independent OS processes instead. Each process is fully
; self-contained (its own PID, its own NNProblem instance, its own RNG
; seeded from that combination's seed) and shares no mutable state with
; any other, so this is safe to raise up to roughly your CPU core count;
; going higher just adds scheduling overhead without more real
; parallelism. The one shared file, nn_summary.csv, is never written
; concurrently: each job writes its own private summary row, which the
; GUI merges in on its single main thread as each job finishes.
parallel_jobs = 1

; Stage 3 (optional) only: "3. Bootstrap CI" (py_scripts/bootstrap_lodo_ci.py).
; Default 1 = original fully serial behavior (one continuing RNG stream
; across all --n-boot replicates). Set > 1 to run that many bootstrap
; replicates concurrently as separate worker processes -- each replicate
; only reads the same immutable merged_dataset.csv and draws its own
; independent resample, so this is safe up to roughly your CPU core count,
; and is the single biggest time cost in this GUI mode (default 1000
; replicates x 2 feature sets x every dataset, each a fresh random-forest
; fit). NOTE: with bootstrap_jobs > 1, each replicate uses its own
; sub-seed instead of one shared stream, so the exact bootstrap draws (not
; their statistical validity) differ slightly from a bootstrap_jobs = 1
; run with the same seed -- see bootstrap_lodo_ci.py's own --jobs docstring.
bootstrap_jobs = 1

[pipeline]
; Meta-dataset pipeline (mode 6), stage 3 only: "Extract ELA features"
; (py_scripts/extract_ela_features.py). Default 1 = original fully serial
; behavior (one *_features.csv file at a time). Set > 1 to compute ELA
; features for that many files concurrently as separate worker processes
; -- each file is read and processed completely independently of every
; other, so this is safe up to roughly your CPU core count. Does not
; affect stage 1 (batch ranking, still governed by [global] parallel_runs/
; omp_threads) or stage 4 (train meta-learner, left as a single LOPO pass
; -- not worth parallelizing for the typical handful-of-dozens problem
; counts this mode runs with).
extract_ela_jobs = 1

