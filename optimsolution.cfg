[portfolio]
; policy: fixed | round_robin | greedy_probe
policy              = greedy_probe
; total_evals: whole per-run budget, probes included
total_evals         = 150000
; segment_evals: budget of ONE committed segment
segment_evals       = 5000
; probe_evals: per-candidate probe budget (greedy_probe only)
probe_evals         = 300
; warmstart_radius0: initial warm-start box, fraction of full range
warmstart_radius0   = 0.35
; warmstart_decay: multiplied into the radius every segment (progressive exploitation)
warmstart_decay     = 0.85
; warmstart_radius_min: floor so the warm-start box never shrinks to a point
warmstart_radius_min = 0.02
; with_baselines: 1 = also run round_robin and one fixed:<method> baseline per
; candidate, on the SAME per-run seeds, and write ranking / Friedman /
; pairwise-Wilcoxon(Holm) comparison tables. 0 = run only the chosen policy
; (much faster, but the Ranking/Friedman/Wilcoxon tabs stay empty, since a
; single variant has nothing to be compared against).
with_baselines      = 1
