[datacentercooling]
; All flags enabled = full hard benchmark.
; Disable one mechanism at a time to perform ablation experiments.
;
; Suggested protocol:
; 1) Keep all flags = 1 as the baseline problem.
; 2) Set exactly one flag to 0 per experiment.
; 3) Compare best / mean / std / convergence / rankings against the full version.

recursive_state_enable        = 1  ; Enables path-dependent debt state (hotspot/recirc/wear/mode_lock carry-over) and terminal debt penalties
oscillatory_ruggedness_enable = 1  ; Enables sinusoidal ruggedness terms in cost and perturbations to thermal/moisture dynamics
threshold_carbon_enable       = 1  ; Enables checkpoint power-budget penalties and terminal carbon-budget overrun penalty
deferred_reliability_enable   = 1  ; Enables deferred debt-based cost accumulation and reliability cost terms
neighbor_coupling_enable      = 1  ; Enables multi-step blending of control inputs and phase coupling in banded actuation
preferred_corridor_enable     = 0  ; Enables comfort-corridor tracking and deceptive preferred operating-window penalty
