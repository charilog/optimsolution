; ============================================================================
; WeatherIrrigation Benchmark Configuration
; All default values match the published mathematical formulation exactly.
; ============================================================================

[mechanisms]
; Ablation switches (set to false to disable individual difficulty mechanisms)
recursive_storage_enable   = 1
oscillatory_efficiency_enable = 1
threshold_losses_enable    = 1
multiplicative_yield_enable = 1
neighbor_coupling_enable   = 1
preferred_window_enable    = 1

; ── Group A: High-priority tunable parameters ─────────────────────
; These control the most impactful difficulty mechanisms (oscillatory efficiency,
; resonance, frequency, yield sensitivity).

osc_eff_amplitude   = 0.22    ; amplitude of oscillatory efficiency in η_i(x)
resonance_weight    = 8.0     ; weight of resonance penalty P_res
osc_freq_base       = 0.22    ; base component of freq_i = 0.22 + 0.09*sin(πs)
osc_freq_amp        = 0.09    ; amplitude component of freq_i
ky_base             = 0.85    ; base of yield sensitivity Ky_i = 0.85 + 0.55*sin(πs)
ky_amp              = 0.55    ; amplitude of yield sensitivity Ky_i

; ── Group B: Medium-priority tunable parameters ───────────────────
; These control storage capacity, deficit penalty, budget penalty, and
; preferred-window penalty.

smax_base           = 50.0    ; base of Smax_i = 50 + 20*sin²(πs)
smax_amp            = 20.0    ; amplitude of Smax_i
deficit_weight      = 0.12    ; weight of deficit penalty in P_def
seasonal_budget_weight = 0.010 ; weight of budget penalty in P_budget
pref_weight         = 0.014   ; base weight of preferred-window penalty P_win

; ── Group C: Lower-priority tunable parameters ────────────────────
; These control soil retention, smoothness penalty, and peak-load threshold.

soil_retention_base = 0.52    ; base of ρ_i = 0.52 + 0.18*sin²(πs)
soil_retention_amp  = 0.18    ; amplitude of ρ_i
smoothness_weight   = 0.06    ; weight of smoothness penalty P_smooth
peak_threshold      = 62.0    ; threshold in P_peak = 0.035 * Σ max(0, Ni - 62)²
