[weatherirrigation]
; All flags enabled = full hard benchmark.
; Disable one mechanism at a time to perform ablation experiments.
;
; Suggested protocol:
; 1) Keep all flags = 1 as the baseline problem.
; 2) Set exactly one flag to 0 per experiment.
; 3) Compare best / mean / std / convergence / rankings against the full version.

recursive_storage_enable      = 1  ; Enables path-dependent soil-water state S_i and terminal storage penalty
oscillatory_efficiency_enable = 1  ; Enables oscillatory efficiency and rugged sinusoidal distortion terms
threshold_losses_enable       = 1  ; Enables threshold-driven deep drainage, overload trigger, and peak-load penalty
multiplicative_yield_enable   = 1  ; Enables multiplicative seasonal yield aggregation (harder than additive averaging)
neighbor_coupling_enable      = 1  ; Enables local coupling through neighboring stages, smoothness, and bilinear interaction
preferred_window_enable       = 1  ; Enables deceptive preferred irrigation window penalty


